name: Build APK
run-name: apkbuild-${{ github.event.inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Android project
        run: bash scripts/gen-project.sh "builds/${{ github.event.inputs.build_id }}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble release APK
        working-directory: project
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare artifact name
        id: art
        run: |
          NAME=$(jq -r '.appName' "builds/${{ github.event.inputs.build_id }}/config.json" | tr -cd '[:alnum:]-_ ' | tr ' ' '-')
          VER=$(jq -r '.versionName' "builds/${{ github.event.inputs.build_id }}/config.json")
          OUT="${NAME}-${VER}.apk"
          cp project/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.event.inputs.build_id }}" \
            "${{ steps.art.outputs.file }}" \
            --title "Build ${{ github.event.inputs.build_id }}" \
            --notes "Automated APK build."

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.build_id }}
          path: ${{ steps.art.outputs.file }}
